<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Jonathan</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header and navigation bar -->
    <header>

        <h1>Contact Me</h1>

        <p>Feel Free to Send Me a Message</p>

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Me</a>
            <a href="contact.html">Contact Me</a>
        </nav>

    </header>


    <!-- Main content -->
    <main>

        <!-- Contact information -->
        <section>

            <h2>Get In Touch</h2>

            <p>
                If you have any questions about me
                you can contact me.
            </p>

            <p>
                My email:
                guangyuan_zhang@s.thevillageschool.com
            </p>

        </section>


        <!-- Contact form -->
        <section>

            <h2>Send Me a Message</h2>

            <form>

                <!-- Name -->
                <label for="name">Your Name:</label>
                <br>

                <input type="text" id="name" name="name">

                <br><br>


                <!-- Email -->
                <label for="email">Your Email:</label>
                <br>

                <input type="text" id="email" name="email">

                <br><br>


                <!-- Subject -->
                <label for="subject">
                    Which subject do you want to ask about?
                </label>
                <br>

                <select id="subject" name="subject">

                    <option value="computer-science">
                        Computer Science
                    </option>

                    <option value="math">
                        Math
                    </option>

                    <option value="science">
                        Chemistry
                    </option>

                    <option value="english">
                        English
                    </option>

                    <option value="history">
                        History
                    </option>

                </select>

                <br><br>


                <!-- Radio buttons -->
                <p>How did you find my website?</p>

                <input type="radio"
                       id="school"
                       name="found"
                       value="school">

                <label for="school">School</label>


                <input type="radio"
                       id="friend"
                       name="found"
                       value="friend">

                <label for="friend">Friend</label>


                <input type="radio"
                       id="internet"
                       name="found"
                       value="internet">

                <label for="internet">Internet</label>

                <br><br>


                <!-- Message -->
                <label for="message">Your Message:</label>
                <br>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    cols="40"></textarea>

                <br><br>


                <!-- Submit button -->
                <button type="submit">
                    Send Message
                </button>

            </form>

        </section>

    </main>


    <!-- Footer -->
    <footer>

        <p>&copy; 2026 Jonathan's Website</p>

    </footer>

</body>

</html>
